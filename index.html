<body>
<title>Модели практикума МИПиС</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: lab-notebook instrument — a compact control column next to a results canvas, one page per practical, routed by #pr1..#pr8 */
:root {
  --bg: #f3f5f8;
  --paper: #ffffff;
  --fg: #16202e;
  --muted: #5b6777;
  --line: #d9dee6;
  --grid: #e7ebf0;
  --accent: #1d4fd7;
  --accent-soft: #e4ebfd;
  --c1: #1d4fd7;
  --c2: #e0662a;
  --c3: #129b82;
  --c4: #a23fb5;
  --c5: #c9a10a;
  --good: #128a5a;
  --warn: #b7791f;
  --bad: #c0392b;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --paper: #161d28; --fg: #e6ebf2; --muted: #93a0b2; --line: #2a3442; --grid: #222b37;
  --accent: #7aa2ff; --accent-soft: #1d2a47; --c1: #7aa2ff; --c2: #ff9a5c; --c3: #3fd0b0; --c4: #d58ae3; --c5: #e8c547;
  --good: #3fbf87; --warn: #e0a84a; --bad: #ef6f61; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141c; --paper: #161d28; --fg: #e6ebf2; --muted: #93a0b2; --line: #2a3442; --grid: #222b37;
  --accent: #7aa2ff; --accent-soft: #1d2a47; --c1: #7aa2ff; --c2: #ff9a5c; --c3: #3fd0b0; --c4: #d58ae3; --c5: #e8c547;
  --good: #3fbf87; --warn: #e0a84a; --bad: #ef6f61; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
a { color: var(--accent); }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
header.top .brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .01em; color: var(--fg); text-decoration: none; }
header.top .brand span { color: var(--accent); }
header.top nav { display: flex; gap: 4px; flex-wrap: wrap; }
header.top nav a { font-family: var(--font-mono); font-size: 13px; text-decoration: none; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
header.top nav a.on, header.top nav a:hover { color: var(--accent); background: var(--accent-soft); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 3.2vw, 32px); line-height: 1.2; margin: 0 0 8px; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.lead { color: var(--muted); max-width: 70ch; margin: 0 0 22px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

/* home */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; text-decoration: none; color: var(--fg); transition: border-color .15s, transform .15s; }
.card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
.card .no { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.card .t { font-weight: 600; font-size: 16px; line-height: 1.3; }
.card .d { color: var(--muted); font-size: 13.5px; }
.card canvas { width: 100%; height: 64px; display: block; margin-top: auto; }
.note { margin-top: 26px; color: var(--muted); font-size: 13px; max-width: 80ch; }

/* lab page */
.lab { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .lab { grid-template-columns: minmax(0, 1fr); } }
.panel { min-width: 0; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel.controls { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) { .panel.controls { position: static; } }
.results { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 980px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label.f > span { font-weight: 500; }
input, select, textarea, button { font: inherit; color: var(--fg); }
input[type=number], input[type=text], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; min-width: 0; }
textarea { font-family: var(--font-mono); font-size: 13px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
button { cursor: pointer; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); padding: 8px 12px; font-weight: 500; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] button.primary { color: #0f141c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0f141c; } }
button:hover { border-color: var(--accent); }
.task { font-size: 13.5px; background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
.task b { font-weight: 600; }
.formula { font-family: var(--font-mono); font-size: 13.5px; background: var(--bg); border: 1px dashed var(--line); border-radius: 7px; padding: 8px 10px; overflow-x: auto; white-space: nowrap; }
.chart { position: relative; height: 280px; }
.chart.tall { height: 340px; }
.chart.short { height: 220px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12.5px; background: var(--bg); }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--font-mono); font-size: 18px; font-weight: 500; }
.kpi .s { font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.concl { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; font-size: 14px; }
.small { font-size: 12.5px; color: var(--muted); }
.mono { font-family: var(--font-mono); }
.strip { display: flex; flex-wrap: wrap; gap: 3px; }
.strip span { width: 18px; height: 22px; border-radius: 3px; font-family: var(--font-mono); font-size: 11px; display: grid; place-items: center; color: #fff; }
svg text { fill: var(--fg); font-family: var(--font-body); }
.editor td input { padding: 4px 6px; font-size: 13px; }
#ed .editor td input { min-width: 56px; }
#ed table.editor { min-width: 460px; }
.editor td { padding: 3px 4px; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 5; font-family: var(--font-mono); }
.chart canvas { display: block; }
.x { border: none; background: none; color: var(--muted); padding: 2px 6px; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

<div class="wrap">

const kpi = (k, v, s = '') => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const num = id => parseFloat(String($('#' + id).value).replace(',', '.'));

/* ============================================================ PR1 */
function pr1() {
  const p = PR[0];
  $('#view').innerHTML = page(p, `
    <label class="f"><span>Вариант (таблица 3)</span><select id="v">${variantOptions(20)}</select></label>
    <label class="f"><span>Метод</span><select id="meth"><option value="lcg">Линейный конгруэнтный (LCG)</option><option value="ms">Середина квадратов</option></select></label>
    <div id="lcgp" class="grid2">
      <label class="f"><span>X₀ (seed)</span><input id="x0" type="number"></label>
      <label class="f"><span>a</span><input id="a" type="number"></label>
      <label class="f"><span>c</span><input id="c" type="number"></label>
      <label class="f"><span>m</span><input id="m" type="number"></label>
    </div>
    <div id="msp" hidden><label class="f"><span>Начальное четырёхзначное X₀</span><input id="ms0" type="number" value="5735"></label></div>
    <label class="f"><span>Объём выборки N</span><input id="n" type="number" value="1000" min="10" max="100000"></label>
    <div class="btns"><button class="primary" id="run">Сгенерировать</button><button id="big">Большой LCG (m = 2³²)</button></div>
    <div class="formula" id="form"></div>
    <p class="small">Uₙ = Xₙ / m — нормированные значения на [0; 1). Для равномерного закона теоретически M = 0,5, D = 1/12 ≈ 0,0833.</p>`,
    `<div class="panel"><h2>Последовательность по шагам</h2><div class="tbl" id="steps"></div></div>
     <div class="panel"><div class="kpis" id="k"></div><div class="concl" id="concl"></div></div>
     <div class="row2"><div class="panel"><h3>Гистограмма, 10 интервалов</h3><div class="chart"><canvas id="h"></canvas></div></div>
     <div class="panel"><h3>Соседние пары (Uₙ, Uₙ₊₁)</h3><div class="chart"><canvas id="sc"></canvas></div></div></div>`);
  const setV = () => { const [x0, a, c, m, s] = V1[+$('#v').value]; $('#x0').value = x0; $('#a').value = a; $('#c').value = c; $('#m').value = m; $('#v').dataset.steps = s; };
  $('#v').onchange = () => { $('#meth').value = 'lcg'; toggle(); setV(); run(); };
  const toggle = () => { const ms = $('#meth').value === 'ms'; $('#lcgp').hidden = ms; $('#msp').hidden = !ms; };
  $('#meth').onchange = () => { toggle(); run(); };
  $('#big').onclick = () => { $('#meth').value = 'lcg'; toggle(); $('#x0').value = 12345; $('#a').value = 1664525; $('#c').value = 1013904223; $('#m').value = 4294967296; $('#v').dataset.steps = 15; run(); };
  $('#run').onclick = run;
  function run() {
    const N = Math.max(10, Math.min(100000, Math.round(num('n')) || 1000)), ms = $('#meth').value === 'ms';
    const steps = +($('#v').dataset.steps || 12);
    let X = [], U = [], rows = [];
    if (!ms) {
      const a = Math.round(num('a')), c = Math.round(num('c')), m = Math.round(num('m')); let x = Math.round(num('x0'));
      $('#form').textContent = `Xₙ₊₁ = (${a}·Xₙ + ${c}) mod ${m}`;
      for (let i = 0; i < N; i++) { const prev = x; x = Number((BigInt(a) * BigInt(x) + BigInt(c)) % BigInt(m)); X.push(x); U.push(x / m); if (i < steps) rows.push([i + 1, `(${a}·${prev} + ${c}) mod ${m}`, x, x / m]); }
      // period
      let period = null; const seen = new Map(); let y = Math.round(num('x0'));
      for (let i = 0; i < Math.min(m + 1, 200000); i++) { if (seen.has(y)) { period = i - seen.get(y); break; } seen.set(y, i); y = Number((BigInt(a) * BigInt(y) + BigInt(c)) % BigInt(m)); }
      p1out(X, U, rows, period, m, true);
    } else {
      let x = Math.round(num('ms0')); $('#form').textContent = 'Xₙ₊₁ = средние 4 цифры числа Xₙ² (8 знаков)';
      const seen = new Map(); let period = null, degen = null;
      for (let i = 0; i < N; i++) { const sq = String(x * x).padStart(8, '0'); const nx = +sq.slice(2, 6); if (i < Math.max(steps, 10)) rows.push([i + 1, `${x}² = ${sq} → ${sq.slice(2, 6)}`, nx, nx / 10000]); if (seen.has(nx) && period === null) { period = i - seen.get(nx); degen = i + 1; } seen.set(nx, i); x = nx; X.push(x); U.push(x / 10000); }
      p1out(X, U, rows, period, 10000, false, degen);
    }
  }
  function p1out(X, U, rows, period, m, lcg, degen) {
    $('#steps').innerHTML = `<table><tr><th>n</th><th>Вычисление</th><th class="num">Xₙ</th><th class="num">Uₙ</th></tr>${rows.map(r => `<tr><td>${r[0]}</td><td class="mono">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${fmt(r[3], 4)}</td></tr>`).join('')}</table>`;
    const M = mean(U), D = varPop(U);
    const period_ok = period === null ? 'не найден' : period;
    $('#k').innerHTML = kpi('Среднее', fmt(M), 'теория 0,5') + kpi('Дисперсия', fmt(D), 'теория 0,0833') + kpi('Min / Max', `${fmt(Math.min(...U), 3)} / ${fmt(Math.max(...U), 3)}`) + kpi('Период', period_ok, lcg ? `максимум ${m > 1e6 ? '2³²' : m}` : 'повтор значения') + kpi('N', U.length);
    const h = hist(U, 10, 0, 1); const exp = U.length / 10;
    const chi = sum(h.c.map(o => (o - exp) ** 2 / exp));
    const dev = Math.max(...h.c.map(o => Math.abs(o - exp)));
    let msg;
    if (lcg && period !== null && period < Math.min(m, U.length)) msg = `Период ${period} меньше объёма выборки: последовательность начинает повторяться после ${period} значений. Для учебной проверки качества возьмите большой модуль m.`;
    else if (!lcg) msg = degen ? `Метод середины квадратов вырождается: значение повторилось на шаге ${degen}, далее последовательность зацикливается (период ${period}).` : 'Повторов на заданном объёме не обнаружено.';
    else msg = `Среднее отличается от 0,5 на ${fmt(Math.abs(M - .5))}, дисперсия от 1/12 — на ${fmt(Math.abs(D - 1 / 12))}. χ² по 10 интервалам = ${fmt(chi, 2)} (критическое значение при α = 0,05 и 9 степенях свободы — 16,92): ${chi < 16.92 ? 'равномерность не отвергается' : 'равномерность отвергается'}. Максимальное отклонение частоты от N/10 — ${fmt(dev, 0)}.`;
    $('#concl').textContent = msg;
    const P = palette();
    chart('h', { type: 'bar', data: { labels: h.mids.map(x => fmt(x, 2)), datasets: [{ label: 'Частота', data: h.c, backgroundColor: hexA(P.c[0], .75), borderColor: P.c[0], borderWidth: 1, barPercentage: 1, categoryPercentage: .95 }, { type: 'line', label: 'Ожидаемая N/10', data: h.c.map(() => exp), borderColor: P.c[1], borderDash: [5, 4], pointRadius: 0, borderWidth: 2 }] }, options: { scales: { x: {}, y: { beginAtZero: true } } } });
    const pts = []; for (let i = 0; i < Math.min(U.length - 1, 3000); i++) pts.push({ x: U[i], y: U[i + 1] });
    chart('sc', { type: 'scatter', data: { datasets: [{ label: 'пары', data: pts, backgroundColor: hexA(P.c[0], .55), pointRadius: U.length > 500 ? 1.6 : 3 }] }, options: { plugins: { legend: { display: false } }, scales: { x: { min: 0, max: 1, title: { text: 'Uₙ' } }, y: { min: 0, max: 1, title: { text: 'Uₙ₊₁' } } } } });
  }
  redraw = run; setV(); run();
}

     <div class="panel"><h2>Показатели (таблица 3)</h2><div class="tbl" id="tab"></div></div></div>`);
  let rows = [];
  const setV = () => { const i = +$('#v').value, [s, w] = V7[i]; $('#sys').innerHTML = `<b>${esc(s)}</b><br>Показать: ${esc(w)}. Пример данных для варианта загружен в таблицу, замените его своими значениями.`; rows = T7[i].map(r => [...r]); render(); };
  $('#v').onchange = setV;
  $('#mu').onclick = () => { rows = [['Клиент 1', 'Ожидание', 0, 3], ['Клиент 1', 'Обслуживание', 3, 8], ['Клиент 2', 'Ожидание', 2, 8], ['Клиент 2', 'Обслуживание', 8, 13], ['Кассир', 'Занят', 3, 13], ['Кассир', 'Простой', 0, 3]]; render(); };
  $('#gen').onclick = () => { const r = mulberry32(Math.round(num('seed'))), nc = Math.round(num('nc')), ns = Math.max(1, Math.round(num('ns'))), ia = num('ia'), sv = num('sv'); const free = new Array(ns).fill(0); let t = 0; rows = []; const busy = Array.from({ length: ns }, () => []);
    for (let k = 1; k <= nc; k++) { t += -Math.log(1 - r()) * ia; const j = free.indexOf(Math.min(...free)); const st = Math.max(t, free[j]); const d = -Math.log(1 - r()) * sv; const r2 = x => Math.round(x * 10) / 10;
      if (st > t + 1e-9) rows.push([`Клиент ${k}`, 'Ожидание', r2(t), r2(st)]); rows.push([`Клиент ${k}`, 'Обслуживание', r2(st), r2(st + d)]); busy[j].push([r2(st), r2(st + d)]); free[j] = st + d; }
    const end = Math.max(...rows.map(x => x[3])); busy.forEach((b, j) => { let c = 0; const nm = ns === 1 ? 'Кассир' : `Канал ${j + 1}`; b.forEach(([s, e]) => { if (s > c) rows.push([nm, 'Простой', c, s]); rows.push([nm, 'Занят', s, e]); c = e; }); if (c < end) rows.push([nm, 'Простой', c, end]); }); render(); };

/* ============================================================ home & routing */
function home() {
  $('#view').innerHTML = `<div class="eyebrow">Моделирование информационных процессов и систем</div>
    <h1>Модели к практическим работам</h1>
    <p class="lead">Выберите практическую работу, укажите номер своего варианта из методических указаний и сравните результаты модели с собственными расчётами. Все модели работают в браузере, исходные данные вариантов взяты из МУ.</p>
    <div class="cards">${PR.map((p, i) => `<a class="card" href="#${p.id}"><span class="no">ПР № ${p.no}</span><span class="t">${p.t}</span><span class="d">${p.d}</span><canvas id="mini${i}" aria-hidden="true"></canvas></a>`).join('')}</div>
    <p class="note">Генератор случайных чисел здесь свой (mulberry32), поэтому при том же seed значения не совпадут с NumPy побитно. Статистические выводы при этом те же: используйте модель для проверки порядка величин и характера графиков.</p>`;
  PR.forEach((_, i) => mini(i));
}
function mini(i) { // small signature sketch per card
  const cv = $('#mini' + i); const dpr = devicePixelRatio || 1; const w = cv.clientWidth, h = cv.clientHeight; cv.width = w * dpr; cv.height = h * dpr; const c = cv.getContext('2d'); c.scale(dpr, dpr); const P = palette(); const r = mulberry32(i + 3); c.lineWidth = 1.6;
  const col = P.c[i % 5];
  if (i === 0) { c.fillStyle = col; for (let k = 0; k < 160; k++) c.fillRect(r() * w, r() * h, 1.8, 1.8); }
  else if (i === 1 || i === 2) { const n = 18; for (let k = 0; k < n; k++) { const x = k / n; const v = i === 1 ? Math.exp(-3 * x) : Math.exp(-((x - .5) ** 2) / .03); c.fillStyle = hexA(col, .75); c.fillRect(k * w / n + 1, h - v * (h - 6), w / n - 2, v * (h - 6)); } }
  else if (i === 3 || i === 4) { const pts = [[w * .2, h * .5], [w * .5, h * .3], [w * .8, h * .6]]; c.strokeStyle = P.muted; c.beginPath(); c.moveTo(...pts[0]); c.quadraticCurveTo(w * .35, 0, ...pts[1]); c.quadraticCurveTo(w * .7, h, ...pts[2]); c.quadraticCurveTo(w * .5, h * 1.1, ...pts[0]); c.stroke(); pts.forEach((p, k) => { c.fillStyle = P.paper; c.strokeStyle = P.c[k]; c.beginPath(); c.arc(p[0], p[1], 9, 0, 7); c.fill(); c.stroke(); }); }
  else if (i === 5) { c.strokeStyle = col; c.beginPath(); let y = h - 4, x = 0; c.moveTo(0, y); while (x < w) { x += r() * 14; c.lineTo(x, y); y = Math.max(6, Math.min(h - 4, y + (r() < .52 ? -7 : 7))); c.lineTo(x, y); } c.stroke(); }
  else if (i === 6) { [[0, .1, .35], [1, .3, .7], [2, .5, .95]].forEach(([k, a, b]) => { c.fillStyle = hexA(P.c[k], .85); c.fillRect(a * w, 6 + k * 19, (b - a) * w, 13); }); }
  else { [[.3, .45], [.6, .3], [.45, .6]].forEach(([y, s], k) => { for (let j = 0; j < 4; j++) { c.fillStyle = hexA(P.c[k], .7); c.beginPath(); c.arc(w * (.25 + k * .25) + (j - 1.5) * 5, h * (y + (r() - .5) * s * .4), 3, 0, 7); c.fill(); } c.strokeStyle = P.c[k]; c.beginPath(); c.moveTo(w * (.25 + k * .25) - 14, h * y); c.lineTo(w * (.25 + k * .25) + 14, h * y); c.stroke(); }); }
}
const ROUTES = { pr1, pr2, pr3, pr4, pr5, pr6, pr7, pr8 };
function route() {
  Object.values(charts).forEach(c => c.destroy()); for (const k in charts) delete charts[k];
  const h = location.hash.slice(1);
  $('#nav').innerHTML = PR.map(p => `<a href="#${p.id}" class="${p.id === h ? 'on' : ''}">ПР ${p.no}</a>`).join('');
  redraw = null; (ROUTES[h] || home)(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
// re-draw in the new theme
let redraw = null;
const rerender = () => { const h = location.hash.slice(1); if (!ROUTES[h]) { PR.forEach((_, i) => $('#mini' + i) && mini(i)); return; } if (redraw) redraw(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerender);
